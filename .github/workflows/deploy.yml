name: Full environment

# Everything in one run, for the first deployment or a rebuild: the API, then the frontend (it needs the API's
# address), the Function app and the feeder job. Day to day, run each part's own workflow when you choose.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  api:
    uses: ./.github/workflows/deploy-api.yml
    secrets: inherit
  frontend:
    needs: api
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
  functions:
    uses: ./.github/workflows/deploy-functions.yml
    secrets: inherit
  jobs:
    needs: api
    uses: ./.github/workflows/deploy-jobs.yml
    secrets: inherit
