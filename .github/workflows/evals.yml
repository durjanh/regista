name: Foundry evaluations

on:
  workflow_dispatch:
    inputs:
      threshold:
        description: Minimum pass rate (0..1)
        default: "0.9"
# Manual only: it calls the deployed models (billed tokens), so it runs when you choose.

permissions:
  id-token: write
  contents: read

jobs:
  evaluate:
    name: Groundedness, fact-check and safety evals against Foundry
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install -r requirements.txt; fi

      - id: azure
        uses: ./.github/actions/azure-context
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          vars-json: ${{ toJSON(vars) }}

      # The API's own settings name every endpoint the evaluator needs, however the environment was provisioned.
      - name: Point the evaluator at the deployed Foundry project (from the API's settings)
        run: |
          az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "${{ steps.azure.outputs.api_app }}" \
            --query "properties.template.containers[0].env" -o json | python3 -c "
          import json, os, sys
          keep = {'AZURE_OPENAI_ENDPOINT', 'FOUNDRY_PROJECT_ENDPOINT', 'AZURE_AI_SERVICES_ENDPOINT', 'AZURE_AI_SERVICES_REGION',
                  'AZURE_AI_SERVICES_RESOURCE_ID', 'AZURE_OPENAI_CHAT_DEPLOYMENT', 'AZURE_OPENAI_REASONING_DEPLOYMENT'}
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for e in json.load(sys.stdin):
                  if e['name'] in keep and e.get('value'):
                      env.write(f\"{e['name']}={e['value']}\\n\"); print(e['name'], 'set')
          "

      - name: Run evaluations
        run: |
          mkdir -p eval-results
          python -m app.evals.run --mode azure \
            --threshold "${{ github.event.inputs.threshold || '0.9' }}" \
            --output eval-results/results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-eval-results-${{ github.run_id }}
          path: services/api/eval-results/
