name: Foundry evaluations

on:
  workflow_dispatch:
    inputs:
      threshold:
        description: Minimum pass rate (0..1)
        default: "0.9"
  schedule:
    - cron: "0 5 * * *"

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  # Let az install the containerapp extension on first use without prompting.
  AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt
  DEPLOYMENT_NAME: main

jobs:
  evaluate:
    name: Groundedness, fact-check and safety evals against Foundry
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install -r requirements.txt; fi

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the evaluator at the deployed Foundry project
        run: |
          out() { az deployment group show -g "$AZURE_RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" --query "properties.outputs.$1.value" -o tsv; }
          {
            echo "AZURE_OPENAI_ENDPOINT=$(out AZURE_OPENAI_ENDPOINT)"
            echo "FOUNDRY_PROJECT_ENDPOINT=$(out FOUNDRY_PROJECT_ENDPOINT)"
            echo "AZURE_AI_SERVICES_ENDPOINT=$(out AZURE_AI_SERVICES_ENDPOINT)"
            echo "AZURE_AI_SERVICES_REGION=$(out AZURE_LOCATION)"
            echo "AZURE_AI_SERVICES_RESOURCE_ID=$(out AZURE_AI_SERVICES_RESOURCE_ID)"
            echo "AZURE_OPENAI_CHAT_DEPLOYMENT=chat"
            echo "AZURE_OPENAI_REASONING_DEPLOYMENT=reasoning"
          } >> "$GITHUB_ENV"

      - name: Run evaluations
        run: |
          mkdir -p eval-results
          python -m app.evals.run --mode azure \
            --threshold "${{ github.event.inputs.threshold || '0.9' }}" \
            --output eval-results/results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-eval-results-${{ github.run_id }}
          path: services/api/eval-results/
