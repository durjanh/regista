name: Test everything

on:
  workflow_dispatch:   # manual: run it when you want the full test run

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    uses: ./.github/workflows/_api-tests.yml

  web:
    name: Frontend
    uses: ./.github/workflows/_frontend-tests.yml

  e2e:
    name: "Frontend: Playwright end-to-end (real browser, real API)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api/requirements*.txt

      - name: API virtual environment (Playwright starts the API from it, offline mode)
        run: |
          python -m venv backend/api/.venv
          backend/api/.venv/bin/pip install -r backend/api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install web dependencies and Chromium
        working-directory: frontend/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: frontend/web
        env:
          CI: "true"
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/web/playwright-report/
            frontend/web/test-results/

  bicep:
    name: "Infrastructure: Bicep build and lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Build every profile (Container Apps, AKS standard, AKS enterprise)
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null
          az bicep build --file infra/aks/main.bicep --stdout > /dev/null
          az bicep build --file infra/aks-enterprise/main.bicep --stdout > /dev/null
          for f in infra/aks/main.parameters.json infra/aks-enterprise/main.parameters.json; do python3 -m json.tool "$f" > /dev/null; done

      - name: Lint (warnings fail the build)
        run: |
          set -o pipefail
          out=""
          for f in infra/main.bicep infra/aks/main.bicep infra/aks-enterprise/main.bicep; do out="$out$(az bicep lint --file "$f" 2>&1 || true)"; done
          for f in infra/modules/*.bicep; do out="$out$(az bicep lint --file "$f" 2>&1 || true)"; done
          echo "$out"
          if echo "$out" | grep -Eq "(Warning|Error) "; then
            echo "::error::Bicep lint reported diagnostics"
            exit 1
          fi

  deploy-config:
    name: azd projects, Kubernetes manifests and hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "azure.yaml files and manifests parse (strict: duplicate keys fail, as in azd)"
        run: |
          ruby scripts/check-yaml.rb azure.yaml deploy/aks/azure.yaml deploy/aks-enterprise/azure.yaml .github/workflows/*.yml .azuredevops/pipelines/*.yml .azuredevops/pipelines/templates/*.yml deploy/k8s/*/*.yaml
          ruby -ryaml -e '
            %w[azure.yaml deploy/aks/azure.yaml deploy/aks-enterprise/azure.yaml].each { |f| YAML.load_file(f) }
            Dir["deploy/k8s/**/*.yaml"].each { |f| YAML.load_stream(File.read(f)).each { |d| abort("#{f}: missing kind") unless d["kind"] } }
            puts "ok"'

      - name: Shared manifests are identical in both AKS profiles
        run: |
          for f in 00-namespace.tmpl.yaml 01-serviceaccount.tmpl.yaml 02-networkpolicy.tmpl.yaml 10-deployment.tmpl.yaml 11-service.tmpl.yaml 20-feeder-cronjob.tmpl.yaml; do
            diff "deploy/k8s/aks/$f" "deploy/k8s/aks-enterprise/$f"
          done

      - name: Hook scripts
        run: |
          for f in deploy/hooks/*.sh; do sh -n "$f"; done; for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck -S warning deploy/hooks/*.sh

  functions:
    name: "Functions: dependency and import check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/functions/requirements.txt

      - run: pip install -r requirements.txt

      - name: Import function app (validates triggers and bindings register)
        run: python -c "import function_app; print('registered:', [f.get_function_name() for f in function_app.app.get_functions()])"
