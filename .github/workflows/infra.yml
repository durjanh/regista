name: Infrastructure

# Infrastructure as code only (Bicep): what-if, then deploy behind the `production` environment. No application code;
# each part has its own workflow (API, Frontend, Functions, Container jobs). Manual.
on:
  workflow_dispatch:   # manual and independent: run it when you choose to deploy this part

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-${{ vars.AZURE_RESOURCE_GROUP }}
  cancel-in-progress: false

env:
  DEPLOYMENT_NAME: main

jobs:
  what-if:
    name: What-if
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: azure
        uses: ./.github/actions/azure-context
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          vars-json: ${{ toJSON(vars) }}

      # Re-running infra keeps the running API image (never reverts it to the placeholder).
      - name: What-if
        env:
          DEPLOYER_PRINCIPAL_ID: ${{ steps.azure.outputs.deployer }}
          SERVICE_API_IMAGE_NAME: ${{ steps.azure.outputs.api_image }}
        run: |
          az deployment group what-if -g "$AZURE_RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" \
            --template-file infra/main.bicep --parameters infra/main.bicepparam --no-pretty-print > whatif.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          changes = json.load(open("whatif.json")).get("changes", [])
          counts = {}
          print("## What-if\n\n| Change | Resource |\n|---|---|")
          for c in changes:
              counts[c["changeType"]] = counts.get(c["changeType"], 0) + 1
              if c["changeType"] not in ("Ignore", "NoChange"):
                  print(f"| {c['changeType']} | `{c['resourceId'].split('/providers/')[-1]}` |")
          print("\n" + ", ".join(f"**{k}**: {v}" for k, v in sorted(counts.items())))
          PY

  deploy:
    name: Provision
    needs: what-if
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - id: azure
        uses: ./.github/actions/azure-context
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          vars-json: ${{ toJSON(vars) }}

      - name: Deploy Bicep
        env:
          DEPLOYER_PRINCIPAL_ID: ${{ steps.azure.outputs.deployer }}
          SERVICE_API_IMAGE_NAME: ${{ steps.azure.outputs.api_image }}
        run: |
          az deployment group create -g "$AZURE_RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" \
            --template-file infra/main.bicep --parameters infra/main.bicepparam --query properties.outputs -o json > outputs.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          print("## Deployment outputs\n\n| Name | Value |\n|---|---|")
          for k, v in json.load(open("outputs.json")).items():
              print(f"| `{k}` | {v['value']} |")
          PY
