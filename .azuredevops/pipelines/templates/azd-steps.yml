# Shared azd steps: install azd (and kubectl/kubelogin for AKS), sign in through the pipeline's workload identity
# federation service connection (azd reuses the Azure CLI session: auth.useAzCliAuth), rebuild the azd
# environment from the variable group (agents are stateless), then run one azd command.

parameters:
  - name: serviceConnection
    type: string
  - name: profile
    type: string
  - name: command
    type: string
    values:
      - preview
      - provision
      - deploy
  # deploy only: one azd service (api, web); empty = every service in the azd project
  - name: service
    type: string
    default: ''

steps:
  - checkout: self
    fetchDepth: 1

  - bash: curl -fsSL https://aka.ms/install-azd.sh | bash
    displayName: Install azd

  - ${{ if ne(parameters.profile, 'containerapps') }}:
      - task: AzureCLI@2
        displayName: Install kubectl and kubelogin
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: sudo az aks install-cli --only-show-errors

  - task: AzureCLI@2
    displayName: azd ${{ parameters.command }} ${{ parameters.service }} (${{ parameters.profile }})
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        profile="${{ parameters.profile }}"
        if [ "$profile" = "containerapps" ]; then
          cd "$(Build.SourcesDirectory)"
        else
          cd "$(Build.SourcesDirectory)/deploy/$profile"
        fi

        azd config set auth.useAzCliAuth true
        azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt \
          || azd env select "$AZURE_ENV_NAME"
        azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"

        # The pipeline principal's object id (from its own token, no Graph permission needed) for the role grants.
        oid=$(az account get-access-token --query accessToken -o tsv | python3 -c \
          "import sys,json,base64; p=sys.stdin.read().split('.')[1]; print(json.loads(base64.urlsafe_b64decode(p+'='*(-len(p)%4)))['oid'])")
        azd env set AZURE_PRINCIPAL_ID "$oid"
        azd env set AZURE_PRINCIPAL_TYPE ServicePrincipal

        # Every infrastructure input from the variable group (the list: deploy/pipeline-env.txt).
        while read -r v <&3; do
          case "$v" in ''|'#'*) continue ;; esac
          val="${!v:-}"
          if [ -n "$val" ]; then azd env set "$v" "$val"; fi
        done 3< "$(Build.SourcesDirectory)/deploy/pipeline-env.txt"

        # Container Apps: provision with the image that is running, so a re-provision never swaps the API back to the
        # placeholder between the Provision and Deploy stages (the agent's azd environment starts empty).
        if [ "$profile" = "containerapps" ]; then
          export AZURE_EXTENSION_USE_DYNAMIC_INSTALL=yes_without_prompt
          img=$(az containerapp list -g "$AZURE_RESOURCE_GROUP" \
                  --query "[?tags.\"azd-service-name\"=='api'].properties.template.containers[0].image | [0]" -o tsv 2>/dev/null || true)
          case "$img" in ''|mcr.microsoft.com/k8se/quickstart*) ;; *) azd env set SERVICE_API_IMAGE_NAME "$img" ;; esac
        fi

        case "${{ parameters.command }}" in
          preview)
            azd provision --preview --no-prompt
            ;;
          provision)
            azd provision --no-prompt
            # Idempotency: a what-if right after provisioning must show no real change (what-if noise ignored).
            "$(Build.SourcesDirectory)/scripts/check-idempotency.sh" \
              || echo "##vso[task.logissue type=warning]Re-running the provision would still change resources (see the log)."
            ;;
          deploy)
            service="${{ parameters.service }}"
            azd env refresh --no-prompt
            if [ -n "$service" ]; then azd deploy "$service" --no-prompt; else azd deploy --no-prompt; fi
            # The postdeploy hook has smoke-tested the API, its CORS and the site. After an API deploy, also run the
            # deployed integration tests: health, CORS, SSE, MCP, the Web PubSub broadcast and the Static Web App.
            if [ -z "$service" ] || [ "$service" = "api" ]; then
              api=$(azd env get-value API_URL); web=$(azd env get-value WEB_URL)
              cd "$(Build.SourcesDirectory)/backend/api"
              python3 -m venv .it && .it/bin/pip install --quiet -r requirements-dev.txt
              REGISTA_IT_API_URL="$api" REGISTA_IT_WEB_URL="$web" .it/bin/pytest -m deployed --no-cov
            fi
            ;;
        esac
