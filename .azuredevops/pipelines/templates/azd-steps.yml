# Shared azd steps: install azd (and kubectl/kubelogin for AKS), sign in through the pipeline's workload identity
# federation service connection (azd reuses the Azure CLI session: auth.useAzCliAuth), rebuild the azd
# environment from the variable group (agents are stateless), then run one azd command.

parameters:
  - name: serviceConnection
    type: string
  - name: profile
    type: string
  - name: command
    type: string
    values:
      - preview
      - provision
      - deploy

steps:
  - checkout: self
    fetchDepth: 1

  - bash: curl -fsSL https://aka.ms/install-azd.sh | bash
    displayName: Install azd

  - ${{ if ne(parameters.profile, 'containerapps') }}:
      - task: AzureCLI@2
        displayName: Install kubectl and kubelogin
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: sudo az aks install-cli --only-show-errors

  - task: AzureCLI@2
    displayName: azd ${{ parameters.command }} (${{ parameters.profile }})
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        profile="${{ parameters.profile }}"
        if [ "$profile" = "containerapps" ]; then
          cd "$(Build.SourcesDirectory)"
        else
          cd "$(Build.SourcesDirectory)/deploy/$profile"
        fi

        azd config set auth.useAzCliAuth true
        azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt \
          || azd env select "$AZURE_ENV_NAME"
        azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"

        # The pipeline principal's object id (from its own token, no Graph permission needed) for the role grants.
        oid=$(az account get-access-token --query accessToken -o tsv | python3 -c \
          "import sys,json,base64; p=sys.stdin.read().split('.')[1]; print(json.loads(base64.urlsafe_b64decode(p+'='*(-len(p)%4)))['oid'])")
        azd env set AZURE_PRINCIPAL_ID "$oid"
        azd env set AZURE_PRINCIPAL_TYPE ServicePrincipal

        for v in APIM_PUBLISHER_EMAIL BUDGET_EMAIL BUDGET_AMOUNT AZURE_DEVOPS_ORG_URL DEVOPS_INFRASTRUCTURE_PRINCIPAL_ID AKS_AUTHORIZED_IP_RANGES; do
          val="${!v:-}"
          if [ -n "$val" ]; then azd env set "$v" "$val"; fi
        done

        case "${{ parameters.command }}" in
          preview)
            azd provision --preview --no-prompt
            ;;
          provision)
            azd provision --no-prompt
            ;;
          deploy)
            azd env refresh --no-prompt
            azd deploy --no-prompt
            ;;
        esac
