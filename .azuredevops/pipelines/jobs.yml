# Regista Container Apps jobs (the feeder that replays a match into Event Hubs): point the job at the image the API
# runs (it runs the API's code). Manual and independent: run it after deploying the API when you want the feeder
# updated. Container Apps only (on AKS the feeder is a CronJob in the API's Kubernetes manifests).

trigger: none   # manual: run it when you choose to deploy this part
pr: none

parameters:
  - name: serviceConnection
    displayName: Azure service connection (workload identity federation)
    type: string
    default: regista-azure

variables:
  - group: regista-containerapps

stages:
  - stage: Deploy
    displayName: Update the feeder job
    jobs:
      - deployment: deploy
        environment: regista-containerapps
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none   # nothing to download: deployment jobs would fetch every artifact by default
                - template: templates/jobs-update.yml
                  parameters:
                    serviceConnection: ${{ parameters.serviceConnection }}
