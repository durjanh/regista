# Regista CI on Azure DevOps (mirror of .github/workflows/ci.yml), run by hand before you deploy: lint, tests
# with coverage floors, the offline evaluation gate (truth score, Verifier drill, grounding, fidelity, calibration,
# scouting), frontend tests and build, Bicep build + lint for all three profiles, azd/Kubernetes config checks.
# The test steps are shared templates, so the per-service pipelines run exactly the same checks.

trigger: none   # manual: run it when you want the full test run
pr: none

pool:
  vmImage: ubuntu-latest

jobs:
  - job: api
    displayName: API — lint, tests (coverage ≥ 90%), evaluation gate
    steps:
      - template: templates/api-tests.yml

  - job: web
    displayName: Frontend — typecheck, tests (coverage floor), build
    steps:
      - template: templates/frontend-tests.yml

  - job: e2e
    displayName: Frontend — Playwright end-to-end (real browser, real API)
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.12"
      - task: UseNode@1
        inputs:
          version: "24.x"
      - bash: |
          set -euo pipefail
          python -m venv backend/api/.venv
          backend/api/.venv/bin/pip install -r backend/api/requirements.txt
          cd frontend/web
          npm ci
          npx playwright install --with-deps chromium
          CI=true npm run e2e
        displayName: API venv, Chromium, Playwright
      - task: PublishPipelineArtifact@1
        condition: always()
        inputs:
          targetPath: frontend/web/playwright-report
          artifact: playwright-report

  - job: infra
    displayName: Bicep build and lint (Container Apps, AKS, AKS enterprise)
    steps:
      - template: templates/infra-validate.yml

  - job: deployConfig
    displayName: azd projects, Kubernetes manifests, hooks
    steps:
      - bash: |
          set -euo pipefail
          ruby scripts/check-yaml.rb azure.yaml deploy/aks/azure.yaml deploy/aks-enterprise/azure.yaml .github/workflows/*.yml .azuredevops/pipelines/*.yml .azuredevops/pipelines/templates/*.yml deploy/k8s/*/*.yaml
          ruby -ryaml -e '
            %w[azure.yaml deploy/aks/azure.yaml deploy/aks-enterprise/azure.yaml].each { |f| YAML.load_file(f) }
            Dir["deploy/k8s/**/*.yaml"].each { |f| YAML.load_stream(File.read(f)).each { |d| abort("#{f}: missing kind") unless d["kind"] } }'
          for f in 00-namespace.yaml 01-serviceaccount.yaml 02-networkpolicy.yaml 10-deployment.yaml 11-service.yaml 20-feeder-cronjob.yaml; do
            diff "deploy/k8s/aks/$f" "deploy/k8s/aks-enterprise/$f"
          done
          for f in deploy/hooks/*.sh; do sh -n "$f"; done; for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck -S warning deploy/hooks/*.sh
        displayName: Parse, compare shared manifests, check scripts
