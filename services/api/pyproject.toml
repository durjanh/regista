[project]
name = "regista-api"
version = "1.0.0"
description = "Explainable football match intelligence: real results rebuilt as synthetic event data, multi-agent narratives, live studio graphics and recaps."
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Default `pytest` = the unit suite (with the coverage floor when run with --cov). The other layers run explicitly:
#   pytest -m integration --no-cov        real uvicorn server over real sockets (offline, no Azure)
#   pytest -m deployed --no-cov           a deployed environment (REGISTA_IT_API_URL, optional REGISTA_IT_WEB_URL)
addopts = "-q -m 'not integration and not deployed'"
markers = [
    "integration: live uvicorn server, real HTTP/SSE/MCP over sockets (no Azure)",
    "deployed: runs against a deployed environment; skipped unless REGISTA_IT_API_URL is set",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
