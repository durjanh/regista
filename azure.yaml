# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# Regista on Azure Container Apps (default profile: cheapest, used for the live judge demo). The React front end is
# on Azure Static Web Apps and calls the API directly.
#   azd auth login && azd up
# Other profiles: deploy/aks (AKS standard) and deploy/aks-enterprise (private AKS behind API Management).
name: regista
metadata:
  template: regista-containerapps@1.0.0
infra:
  provider: bicep
  path: infra
  module: main
services:
  api:
    project: ./services/api
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ../..        # the API image bundles data/ from the repository root
  web:
    project: ./apps/web
    language: js
    host: staticwebapp
    dist: dist                 # Vite build output; the SPA calls API_URL directly (CORS)
    hooks:
      prepackage:
        shell: sh
        run: |
          set -e
          [ -f package.json ] || cd apps/web 2>/dev/null || cd ../../apps/web
          if [ -z "${API_URL:-}" ]; then echo "API_URL not known yet: run 'azd provision' before packaging the web app"; exit 0; fi
          printf 'VITE_API_BASE_URL=%s\n' "$API_URL" > .env.production.local
      predeploy:
        shell: sh
        run: |
          set -e
          [ -f package.json ] || cd apps/web 2>/dev/null || cd ../../apps/web
          if [ -z "${API_URL:-}" ]; then echo "API_URL not known yet: run 'azd provision' before packaging the web app"; exit 0; fi
          printf 'VITE_API_BASE_URL=%s\n' "$API_URL" > .env.production.local
          # azd up packages before it provisions; rebuild if this bundle was built without the API's address.
          if [ -d dist ] && ! grep -rqs "${API_URL#https://}" dist/assets; then npm run build; fi
hooks:
  preprovision:
    shell: sh
    run: deploy/hooks/preprovision.sh    # forget an image that azd down removed with its registry
  postprovision:
    shell: sh
    run: deploy/hooks/fabric.sh          # optional: only when FABRIC_WORKSPACE_NAME is set
  postdeploy:
    shell: sh
    run: deploy/hooks/postdeploy.sh
