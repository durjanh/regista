# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# Regista on AKS, enterprise profile: API Management Standard v2 is the only public endpoint; it reaches the
# internal NGINX ingress through VNet integration. Private AKS; every PaaS service behind a private endpoint.
#   cd deploy/aks-enterprise
#   azd env set APIM_PUBLISHER_EMAIL you@example.com
#   azd provision          # one pass
#   azd deploy             # from inside the VNet: the Managed DevOps Pool (.azuredevops/pipelines/azure-dev.yml)
# The API server and registry are private, so `azd deploy` from a laptop fails by design. Development only:
#   azd env set AKS_PRIVATE_CLUSTER false && azd env set AKS_AUTHORIZED_IP_RANGES <your-ip>/32
# makes the API server public but IP-restricted (the registry and data services stay private).
name: regista-aks-enterprise
metadata:
  template: regista-aks-enterprise@1.0.0
infra:
  provider: bicep
  path: ../../infra/aks-enterprise
  module: main
services:
  api:
    project: ../../backend/api
    language: python
    host: aks
    docker:
      path: ./Dockerfile
      context: ../..
    k8s:
      namespace: regista
      deploymentPath: ../../deploy/k8s/aks-enterprise
      deployment:
        name: regista-api
      service:
        name: regista-api
      ingress:
        name: regista-api
  web:
    project: ../../frontend/web
    language: js
    host: staticwebapp
    dist: dist                 # Vite build output; the SPA calls API_URL directly (CORS)
    hooks:
      prepackage:
        shell: sh
        run: |
          set -e
          [ -f package.json ] || cd frontend/web 2>/dev/null || cd ../../frontend/web
          if [ -z "${API_URL:-}" ]; then echo "API_URL not known yet: run 'azd provision' before packaging the web app"; exit 0; fi
          printf 'VITE_API_BASE_URL=%s\n' "$API_URL" > .env.production.local
      predeploy:
        shell: sh
        run: |
          set -e
          [ -f package.json ] || cd frontend/web 2>/dev/null || cd ../../frontend/web
          if [ -z "${API_URL:-}" ]; then echo "API_URL not known yet: run 'azd provision' before packaging the web app"; exit 0; fi
          printf 'VITE_API_BASE_URL=%s\n' "$API_URL" > .env.production.local
          # azd up packages before it provisions; rebuild if this bundle was built without the API's address.
          if [ -d dist ] && ! grep -rqs "${API_URL#https://}" dist/assets; then npm run build; fi
# The shared hooks live in deploy/hooks, outside this project folder. azd 1.37+ refuses a hook *path* that leaves the
# project ("escapes project root"), so each runs as an inline command instead (working directory: this folder).
hooks:
  postprovision:
    shell: sh
    run: sh ../hooks/postprovision.sh
  postdeploy:
    shell: sh
    run: sh ../hooks/postdeploy.sh
