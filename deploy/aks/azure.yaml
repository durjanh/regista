# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# Regista on AKS, standard profile: the API behind a public NGINX on a static IP with HTTPS (cert-manager + Let's
# Encrypt), the SPA on Azure Static Web Apps, keyless PaaS.
#   cd deploy/aks && azd env set LETSENCRYPT_EMAIL you@example.com && azd up
# Prerequisites: azd, Azure CLI, Docker, kubectl and kubelogin (az aks install-cli); local accounts are disabled.
name: regista-aks
metadata:
  template: regista-aks@1.0.0
infra:
  provider: bicep
  path: ../../infra/aks
  module: main
services:
  api:
    project: ../../backend/api
    language: python
    host: aks
    docker:
      path: ./Dockerfile
      context: ../..
    k8s:
      namespace: regista
      deploymentPath: ../../deploy/k8s/aks      # relative to the service project
      deployment:
        name: regista-api
      service:
        name: regista-api
      ingress:
        name: regista-api
  web:
    project: ../../frontend/web
    language: js
    host: staticwebapp
    dist: dist                 # Vite build output; the SPA calls API_URL directly (CORS)
    hooks:
      prepackage:
        shell: sh
        run: |
          set -e
          [ -f package.json ] || cd frontend/web 2>/dev/null || cd ../../frontend/web
          if [ -z "${API_URL:-}" ]; then echo "API_URL not known yet: run 'azd provision' before packaging the web app"; exit 0; fi
          printf 'VITE_API_BASE_URL=%s\n' "$API_URL" > .env.production.local
      predeploy:
        shell: sh
        run: |
          set -e
          [ -f package.json ] || cd frontend/web 2>/dev/null || cd ../../frontend/web
          if [ -z "${API_URL:-}" ]; then echo "API_URL not known yet: run 'azd provision' before packaging the web app"; exit 0; fi
          printf 'VITE_API_BASE_URL=%s\n' "$API_URL" > .env.production.local
          # azd up packages before it provisions; rebuild if this bundle was built without the API's address.
          if [ -d dist ] && ! grep -rqs "${API_URL#https://}" dist/assets; then npm run build; fi
hooks:
  postprovision:
    shell: sh
    run: ../hooks/postprovision.sh
  postdeploy:
    shell: sh
    run: ../hooks/postdeploy.sh
