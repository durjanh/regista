# Zero-trust inside the namespace (Cilium): nothing reaches a pod unless allowed below.
#   ingress controller (app-routing-system) -> web :8080
#   web -> api :8000
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: regista
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-web
  namespace: regista
spec:
  podSelector:
    matchLabels:
      app: regista-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-routing-system
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-api
  namespace: regista
spec:
  podSelector:
    matchLabels:
      app: regista-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: regista-web
      ports:
        - port: 8000
          protocol: TCP
