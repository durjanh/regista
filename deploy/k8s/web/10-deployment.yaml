# The React app behind nginx; nginx proxies /api and /mcp to the API service inside the cluster.
# deploy/k8s/web-enterprise/10-deployment.yaml must stay identical (checked in CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regista-web
  namespace: regista
  labels:
    app: regista-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: regista-web
  template:
    metadata:
      labels:
        app: regista-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: regista-web
      containers:
        - name: web
          image: "{{.Env.SERVICE_WEB_IMAGE_NAME}}"
          ports:
            - containerPort: 8080
          env:
            - { name: API_UPSTREAM, value: "http://regista-api.regista.svc.cluster.local:8000" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 30
