# Standard profile: public ingress through the AKS application routing add-on (managed NGINX).
# Server-sent events need unbuffered, long-lived connections.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regista-web
  namespace: regista
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: "{{.Env.INGRESS_CLASS}}"
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regista-web
                port:
                  number: 8080
