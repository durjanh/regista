# Let's Encrypt for the API's hostname (HTTP-01 through nginx-public). cert-manager itself is installed by the
# postprovision hook (pinned version). The SPA on Static Web Apps is HTTPS, so the API must be HTTPS too
# (browsers block mixed content). LETSENCRYPT_EMAIL is required: azd env set LETSENCRYPT_EMAIL you@example.com
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "{{.Env.LETSENCRYPT_EMAIL}}"
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx-public
