# Workload identity: pods using this service account get Entra tokens for the shared user-assigned identity
# (federated credential created in infra/modules/aks.bicep). No secrets in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: regista-api
  namespace: regista
  annotations:
    azure.workload.identity/client-id: "{{.Env.AZURE_CLIENT_ID}}"
